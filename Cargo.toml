[workspace]
resolver = "2"
members = ["crates/tercore", "crates/terstudio"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/itriedcoding/TerCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
futures-util = "0.3"
# reqwest is declared per-crate with a platform TLS backend: Schannel on
# Windows (no C toolchain, no OpenSSL), rustls elsewhere for tests/CI.
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
quick-xml = "0.37"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
